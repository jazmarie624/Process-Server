<title>J Empire — Florida Process Server Study</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A84C; --gold-lt:#F0D080; --gold-dk:#9A7530;
    --cream:#FAF6EE; --dark:#1A1209; --charcoal:#2D2416;
    --card:#FFFFFF; --border:#E8DFC8; --ink:#241B0E; --muted:#6B5C42;
    --green:#2A7A4F; --green-bg:#E8F5EE;
    --red:#B83232; --red-bg:#FAE8E8;
    --blue:#1A4F8A; --blue-bg:#E8F0FA;
    --purple:#6B3FA0; --purple-bg:#F0E8FA;
    --orange:#B35F38; --orange-bg:#FAF0EB;
    --teal:#1A7A6E; --teal-bg:#E8F5F3;
    --pink:#A03F6B; --pink-bg:#FAE8F0;
    --nav:250px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:17px; line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  #app{min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit;font-size:17px}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15;letter-spacing:-.01em}

  /* ---------- top bar ---------- */
  .topbar{
    background:linear-gradient(160deg,var(--charcoal),var(--dark));
    color:var(--cream); padding:18px 20px 16px;
    border-bottom:3px solid var(--gold);
    position:sticky; top:0; z-index:60;
    padding-top:calc(18px + env(safe-area-inset-top));
  }
  .topbar .inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .topbar .crown{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-lt);font-weight:700}
  .topbar h1{font-size:26px;font-weight:900;color:#fff;margin-top:3px}
  .topbar p{margin:4px 0 0;font-size:14px;color:#CFC3AA}
  .backbtn{
    display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:15px;
    color:var(--gold-lt);margin-bottom:8px;padding:4px 0;
  }
  .menubtn{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    background:rgba(240,208,128,.14);border:2px solid var(--gold-dk);color:var(--gold-lt);
    font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
    padding:10px 15px;border-radius:11px;
  }

  /* ---------- shell: nav + main ---------- */
  .shell{flex:1;display:flex;max-width:1180px;width:100%;margin:0 auto;align-items:flex-start}
  .sidenav{
    display:none; flex:0 0 var(--nav); width:var(--nav);
    padding:20px 12px 60px 16px; position:sticky; top:112px;
    max-height:calc(100vh - 112px); overflow-y:auto;
  }
  .sidenav.open{display:block}
  .navgroup{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px 8px}
  .navgroup:first-child{margin-top:0}
  .navitem{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:11px 12px;border-radius:11px;font-weight:600;font-size:15.5px;
    margin-bottom:3px;border:2px solid transparent;line-height:1.3;
  }
  .navitem:hover{background:#F2EADA}
  .navitem.active{background:#fff;border-color:var(--gold);font-weight:800}
  .navitem .ic{flex:0 0 auto;font-size:18px;width:22px;text-align:center}
  .navitem .tick{margin-left:auto;font-size:13px;color:var(--green);font-weight:900}

  .main{flex:1;min-width:0;padding:20px 16px 70px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}

  /* ---------- narrow: nav becomes a dropdown panel ---------- */
  @media (max-width:819px){
    .sidenav{
      position:fixed;top:0;left:0;right:0;bottom:0;width:100%;flex-basis:auto;
      background:var(--cream);z-index:80;padding:20px 16px 60px;max-height:none;
      overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top));
    }
    .sidenav .closerow{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .sidenav .closerow b{font-family:Fraunces,serif;font-size:22px}
    .sidenav .closerow button{font-size:17px;font-weight:800;padding:10px 16px;border-radius:11px;background:var(--charcoal);color:var(--gold-lt)}
    .navitem{padding:14px 13px;font-size:17px}
  }
  @media (min-width:820px){
    body{font-size:18px}
    .sidenav{display:block;border-right:2px solid var(--border);background:#F6F0E2;min-height:calc(100vh - 112px)}
    .sidenav .closerow{display:none}
    .menubtn{display:none}
    .main{padding:26px 30px 80px}
    .topbar h1{font-size:30px}
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--card);border:2px solid var(--border);border-radius:16px;
    padding:18px;margin-bottom:14px;
  }
  .card h2{font-size:21px;font-weight:800}
  .card h3{font-size:18px;font-weight:700}

  .modgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
  @media (min-width:820px){ .modgrid{grid-template-columns:1fr 1fr} }

  .modbtn{
    display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
    background:var(--card);border:2px solid var(--border);border-radius:16px;
    padding:16px;transition:transform .12s ease,border-color .12s ease;
  }
  .modgrid .modbtn{margin-bottom:0;height:100%}
  .modbtn:active{transform:scale(.985)}
  .modbtn .emoji{font-size:28px;line-height:1;flex:0 0 auto;margin-top:2px}
  .modbtn .t{font-family:Fraunces,serif;font-weight:800;font-size:18.5px;display:block}
  .modbtn .s{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
  .modbtn .meta{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:7px;display:block}
  .done{margin-left:auto;font-size:20px;flex:0 0 auto}

  .bar{background:var(--border);border-radius:99px;height:10px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;transition:width .35s ease}

  .lesson{border:2px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;background:var(--card)}
  .lesson>button{width:100%;display:flex;gap:12px;align-items:center;padding:16px;text-align:left;font-weight:700}
  .lesson .body{
    padding:0 18px 18px;white-space:pre-wrap;font-size:17px;line-height:1.65;
    border-top:1px dashed var(--border);padding-top:15px;max-width:70ch;
  }
  .lesson .chev{margin-left:auto;font-size:13px;color:var(--muted)}

  /* ---------- quiz ---------- */
  .qwrap{max-width:760px}
  .opt{
    display:block;width:100%;text-align:left;padding:15px;border-radius:12px;
    border:2px solid var(--border);background:var(--card);margin-bottom:9px;font-weight:600;font-size:16.5px;
  }
  .opt.correct{border-color:var(--green);background:var(--green-bg)}
  .opt.wrong{border-color:var(--red);background:var(--red-bg)}
  .opt.dim{opacity:.55}
  .explain{padding:14px;border-radius:12px;font-size:16px;margin-bottom:12px;border-left:5px solid;line-height:1.6}
  .explain.ok{background:var(--green-bg);border-color:var(--green)}
  .explain.no{background:var(--red-bg);border-color:var(--red)}

  .btn{
    display:block;width:100%;max-width:520px;padding:16px;border-radius:13px;font-weight:800;font-size:17px;
    background:var(--charcoal);color:var(--gold-lt);border:2px solid var(--charcoal);
  }
  .btn.gold{background:var(--gold);border-color:var(--gold-dk);color:#2A1E08}
  .btn.ghost{background:transparent;color:var(--charcoal);border-color:var(--border)}
  .btn+.btn{margin-top:10px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px}
  .stat{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px;text-align:center}
  .stat b{display:block;font-family:Fraunces,serif;font-size:26px;font-weight:900}
  .stat span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

  .flash{
    background:var(--charcoal);color:var(--cream);border-radius:18px;padding:34px 26px;
    min-height:250px;display:flex;flex-direction:column;justify-content:center;text-align:center;
    border:3px solid var(--gold);margin-bottom:14px;max-width:760px;
  }
  .flash .cat{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-lt);font-weight:800;margin-bottom:14px}
  .flash .q{font-family:Fraunces,serif;font-size:23px;font-weight:800;line-height:1.32}
  .flash .a{font-size:17.5px;line-height:1.62;color:#EDE3CE}

  .chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--border);text-align:left;width:100%}
  .chk:last-child{border-bottom:none}
  .chk .box{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
  .chk.on .box{background:var(--green);border-color:var(--green);color:#fff}
  .chk.on span{text-decoration:line-through;opacity:.55}

  .colgrid{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:1000px){ .colgrid{grid-template-columns:1fr 1fr;align-items:start} }

  .term{border-bottom:1px solid var(--border);padding:13px 0}
  .term:last-child{border-bottom:none}
  .term b{font-family:Fraunces,serif;font-size:16.5px;letter-spacing:.02em}
  .term p{margin:3px 0 0;font-size:15.5px;color:var(--muted);line-height:1.55}

  .inp{width:100%;max-width:520px;padding:15px;border-radius:12px;border:2px solid var(--border);background:#fff;margin-bottom:10px}
  .inp:focus{outline:3px solid var(--gold-lt);outline-offset:1px;border-color:var(--gold)}
  button:focus-visible,.modbtn:focus-visible,.navitem:focus-visible{outline:3px solid var(--gold-dk);outline-offset:2px}

  .pagetitle{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .note{font-size:14px;color:var(--muted);margin-top:22px;line-height:1.55;max-width:70ch}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ============================================================
   MODULES

var MODULES = [
{
  id:1, emoji:'⚖️', title:'What Is Process Serving?', subtitle:'The foundation',
  color:'var(--blue)', bg:'var(--blue-bg)', read:'6 min',
  lessons:[
  { title:"What is 'process'?", icon:'📄', content:
`Process is any official court document that commands a person to do something — or stop doing something. It is the court's way of saying "you are involved in a legal case."

COMMON TYPES OF PROCESS
• SUMMONS — tells someone they've been sued and must respond
• COMPLAINT — describes what the lawsuit is about
• SUBPOENA — orders someone to appear or produce documents
• WRITS — court orders commanding specific actions
• INJUNCTIONS — orders requiring someone to stop doing something

🔑 KEY RULE: Due process guarantees no one can be taken to court without proper notice first. Service of process is how that notice happens. Without it, a case can be thrown out.

⚖️ WHY IT MATTERS: Process must be delivered correctly for the court to have JURISDICTION over the person sued. Bad service means the court cannot legally act, and a judgment can be vacated later.

📋 FOR PROCESS TO BE VALID
1. It bears the SEAL of the court
2. It is SIGNED by the person who served it
3. It carries the required SERVICE INFORMATION (date, time, manner)
4. It is served in the MANNER PRESCRIBED BY LAW

💡 No valid service = no valid judgment, no matter how strong the case.` },

  { title:'Who can serve process in Florida?', icon:'👤', content:
`§48.021(1) — process is served by the sheriff of the county where the person is found, EXCEPT that nonenforceable civil process, criminal witness subpoenas, and criminal summonses may be served by a special process server appointed by the sheriff, or by a certified process server under §48.27. Civil witness subpoenas may be served by any person authorized by the rules of civil procedure.

1. 🏛️ THE SHERIFF — the default server in every county.

2. ⭐ SPECIAL PROCESS SERVER — appointed by the SHERIFF. Authorized in ONLY the county of the appointing sheriff (§48.021(3)).

3. 🎓 CERTIFIED PROCESS SERVER (CPS) — that's you. Certified by the CHIEF JUDGE of the judicial circuit. Serves anywhere within that circuit.

❌ WHO CANNOT SERVE: parties to the case, anyone under 18, anyone with a mental or legal disability.

🚨 FALSE RETURN — KNOW YOUR OWN STATUTE
• CERTIFIED process server → §48.31(2)
• SPECIAL process server → §48.021(4)
Either way: FELONY OF THE THIRD DEGREE and a permanent bar from serving process in Florida. Because you are certifying in the Ninth Circuit, §48.31(2) is YOUR provision.` },

  { title:'The 9th Circuit — your circuit', icon:'🗺️', content:
`The Ninth Judicial Circuit covers ORANGE COUNTY and OSCEOLA COUNTY. One certification covers both.

WHAT THE STATUTE REQUIRES (§48.29(3))
• At least 18 years old
• No mental or legal disability
• Permanent resident of Florida
• Background investigation
• Certificate of good conduct — no pending criminal case, no felony conviction, no conviction of a misdemeanor involving moral turpitude or dishonesty within the past 5 years
• An examination IF prescribed by the chief judge — the chief judge sets the content and the passing grade
• A $5,000 surety bond, renewable annually
• An oath of office

WHAT THE NINTH CIRCUIT REQUIRES (from ninthcircuit.org)
• Applications are accepted QUARTERLY
• Initial application: $300 — renewal: $250 (payable to "State of Florida")
• FDLE background check
• Certificate of good conduct
• Passing examination grade of 80% or better
• $5,000 surety bond

🆔 ID CARD (§48.29(5)(b)): bears your identification number, printed name, signature, photograph, the SEAL OF THE CIRCUIT COURT, and an expiration date. Renewable annually on proof of good standing and current bond.

🔁 RENEWAL in the Ninth Circuit is annual and requires the application, fee, background check, certificate of good conduct, an 80% exam result, and a current bond.

🔑 There is NO statewide process server license. You must be certified in EACH circuit (§48.29(7)).` }],

  quiz:[
  {q:"What does 'process' mean in legal terms?",
   options:['A court fine','Official court documents commanding action','A police report',"A judge's ruling"],correct:1,
   explain:'Process = official court documents (summons, complaints, subpoenas, writs) that command someone to act or appear.'},
  {q:'A CERTIFIED process server who executes a false return is punished under which statute?',
   options:['§48.021(4)','§48.27(2)','§48.31(2)','§48.29(6)'],correct:2,
   explain:'§48.31(2) governs certified process servers — third degree felony plus a permanent bar. §48.021(4) is the parallel provision for SPECIAL process servers.'},
  {q:'The 9th Judicial Circuit covers which counties?',
   options:['Orange & Seminole','Osceola & Polk','Orange & Osceola','Orange & Lake'],correct:2,
   explain:'The 9th Judicial Circuit = Orange County + Osceola County. One certification, two counties.'},
  {q:'Who sets the content and passing grade of the CPS examination?',
   options:['FAPPS','The Florida Supreme Court','The chief judge of the circuit','The Department of State'],correct:2,
   explain:'§48.29(3)(f) — the chief judge of the circuit prescribes the content, the passing grade, and how often it is offered. The Ninth Circuit requires 80% or better.'},
  {q:'Is there a statewide process server license in Florida?',
   options:['Yes — issued by the Supreme Court','Yes — through FDLE','No — you certify in each circuit','Yes — it covers all 20 circuits'],correct:2,
   explain:'No statewide license exists. §48.29(7) lets you qualify in more than one circuit, but each one is separate.'},
  {q:'A SPECIAL process server appointed by a sheriff may serve process where?',
   options:['Anywhere in Florida','Only in the county of the appointing sheriff','Anywhere in the judicial circuit','Only in adjacent counties'],correct:1,
   explain:'§48.021(3) — a special process server is authorized only in the county of the sheriff who appointed them. A CPS covers the whole circuit.'}]
},

{
  id:2, emoji:'🚪', title:'Methods of Service', subtitle:'Chapter 48 core rules',
  color:'var(--purple)', bg:'var(--purple-bg)', read:'10 min',
  lessons:[
  { title:'Personal service — the gold standard', icon:'🤝', content:
`Personal service means handing the documents DIRECTLY to the person named. Courts favor it above every other method.

HOW IT WORKS (§48.031(1)(a))
Deliver a copy of the process together with a copy of the complaint, petition, or other initial pleading to the person to be served.

✅ EMPLOYER RULE (§48.031(1)(b)): an employer contacted by an authorized server must allow service in a PRIVATE AREA designated by the employer. An employer who refuses commits a NONCRIMINAL VIOLATION punishable by a fine of up to $1,000.

🔑 DOCUMENT EVERY TIME
• Exact date and time
• Exact address
• Full name of the person served
• Physical description
• How you confirmed identity

🚨 DISINTERESTED (§48.31(2)): you must have no personal or financial stake in any case you serve.

📝 ON THE PAPER ITSELF (§48.031(5)): on the FIRST PAGE ONLY of at least one of the processes served, write the date and time of service, your initials or signature, and your identification number.` },

  { title:"Substitute service at the abode", icon:'🏠', content:
`When the person can't be handed the papers directly, Florida allows substitute service at their home.

THE 3 REQUIREMENTS (§48.031(1)(a)) — ALL THREE
1. 📍 USUAL PLACE OF ABODE — where the defendant actually LIVES right now. One person, one abode at a time.
2. 👥 A PERSON RESIDING THERE who is AT LEAST 15 YEARS OLD. A visitor doesn't count. A 14-year-old doesn't count.
3. 📢 INFORM THAT PERSON OF THE CONTENTS.

Also in §48.031(1)(a): minors who are or have been MARRIED are served like any adult under this section.

SPOUSE SUBSTITUTION (§48.031(2)(a)) — THREE CONDITIONS
Substituted service on the spouse may be made anywhere in a county by a server authorized in that county IF:
① the cause of action is NOT an adversarial proceeding between the spouse and the person to be served; AND
② the SPOUSE REQUESTS such service, OR the spouse is also a party to the action; AND
③ the spouse and the person to be served RESIDE TOGETHER in the same dwelling — regardless of whether that dwelling is in the county where the substituted service is made.

SOLE PROPRIETOR (§48.031(2)(b))
At the place of business, during regular business hours, serve the person in charge — but only after TWO attempts to serve the owner there.

⚠️ Sliding papers under a door is not service. Dropping them in a residential mailbox is not service. (One narrow exception follows in the next lesson.)` },

  { title:'Private mailboxes, virtual offices & registered offices', icon:'📬', content:
`Two provisions that people miss — and that answer the "you can never use a mailbox" assumption.

📮 PRIVATE MAILBOX / VIRTUAL OFFICE (§48.031(6))
IF the ONLY address for the person that is discoverable through public records is a private mailbox, a virtual office, or an executive office or mini suite, substituted service MAY be made by leaving a copy of the process with the PERSON IN CHARGE of that location — but ONLY if you determine that the person to be served actually maintains a mailbox or office there.

• "VIRTUAL OFFICE" = provides communications services (phone/fax) and address services with no dedicated office space, all communications routed through a common receptionist.
• "EXECUTIVE OFFICE OR MINI SUITE" = communications services, a DEDICATED office space, and other supportive services, all routed through a common receptionist.

🏢 REGISTERED OFFICES (§48.091)
• (3) The registered agent must keep the registered office OPEN at least 10 a.m.–12 noon and 2 p.m.–4 p.m. every day except Saturdays, Sundays, and legal holidays, with someone there on whom process may be served.
• (4)(a) A registered agent who is a natural person may be served under §48.031.
• (4)(b) If you go to the DESIGNATED REGISTERED OFFICE to serve a natural-person registered agent and that person is not present, you may serve ANY EMPLOYEE of that agent who is present — INCLUDING DURING THE FIRST ATTEMPT.
• (4)(c) If the registered agent is not a natural person, serve it under the law for that entity type, or any employee of the agent present at the office.
• (5) The agent must forward the papers — but failing to forward does NOT invalidate your service.

🔑 EXAM TRAP: "the registered agent is out of the office" does not automatically end your attempt at the registered office. Look for an employee who is present.` },

  { title:'Businesses & entities — current law', icon:'🏢', content:
`⚠️ The rules for serving businesses changed on January 2, 2023 (ch. 2022-190) and were adjusted again effective October 1, 2025 (ch. 2025-13). Older study material that starts with "president, then VP, then cashier" is outdated.

🏢 CORPORATIONS (§48.081)
1st → REGISTERED AGENT (§48.081(2))
2nd → If the corporation ceases to have a registered agent, or the agent cannot be served after ONE GOOD FAITH ATTEMPT: (a) chair of the board, president, any vice president, secretary, or treasurer; OR (b) any person listed publicly on its LATEST ANNUAL REPORT, as most recently amended (§48.081(3))
3rd → If, after due diligence, service still can't be completed and the narrow conditions in §48.081(4) are met: the Secretary of State under §48.161, or a court order under §48.102

🤝 LLCs (§48.062)
1st → REGISTERED AGENT (§48.062(2))
2nd → If no agent or the agent can't be served after one good faith attempt, ANY of these (§48.062(3)):
   (a) any MANAGER of a manager-managed LLC
   (b) any MEMBER of a member-managed LLC
   (c) any person LISTED PUBLICLY ON THE LATEST ANNUAL REPORT
3rd → Secretary of State (§48.161) or court order (§48.102) under §48.062(4)
There is NO "designated employee" step for an LLC — that step belongs to partnerships.

👥 PARTNERSHIPS (§48.061)
• PLAIN general partnership: any PARTNER first. If a partner isn't available during regular business hours they may designate an employee or agent. After ONE attempt on a partner or designated employee, serve the PERSON IN CHARGE during regular business hours.
• LLP: REGISTERED AGENT first, then any partner, then designated employee, then person in charge after one attempt, then SOS/court order.
• LP and LLLP: REGISTERED AGENT first, then any GENERAL PARTNER, then SOS/court order.

🏦 FINANCIAL INSTITUTIONS (§48.092): served in accordance with §655.0201.

🏛️ PUBLIC AGENCIES (§48.111(1)) — CURRENT ORDER
(a) THE REGISTERED AGENT; or
(b) if there is no registered agent, or the agent can't be served after one good faith attempt, in this order:
   1. president, mayor, chair, or other head
   2. vice president, vice mayor, or vice chair
   3. any member of the governing board/council/commission, the manager of the entity, or an in-house attorney
   4. any employee of the entity at its MAIN OFFICE
§48.111(2): a public agency that is not a body corporate and has no governing board → serve the public officer being sued or the chief executive officer.

🏛️ THE STATE (§48.121): serve the state attorney or an assistant state attorney for the circuit, AND send TWO COPIES by registered or certified mail to the Attorney General.

🔑 GOLDEN RULE: corporations, LLCs, LLPs, LPs, and public agencies all start with the REGISTERED AGENT.` },

  { title:'Minors, incompetents & prisoners', icon:'👶', content:
`👶 MINORS (§48.041)
Process against a minor WHO HAS NEVER BEEN MARRIED is served:
(a) by serving a PARENT or guardian of the minor under §48.031 — or, when a legal guardian has been appointed, by serving the GUARDIAN under §48.031; and
(b) by serving the GUARDIAN AD LITEM or other court-appointed representative, if one is appointed. Service on the guardian ad litem is unnecessary when they appear voluntarily or the court orders the appearance without service.

A minor who is or has been MARRIED is served like an adult under §48.031(1)(a).

Case law: Jones v. Lucks — handing papers to an unmarried minor and saying "someone is suing you" was ruled insufficient.

🧠 INCOMPETENT PERSONS (§48.042)
(a) serve TWO COPIES on the person who has care or custody — or serve the legal GUARDIAN under §48.031 if one is appointed; and
(b) serve the guardian ad litem if appointed, unless they appear voluntarily.

🔒 STATE PRISONERS (§48.051)
One sentence, and it is exactly what it says: process against a state prisoner shall be served ON THE PRISONER. This lines up with Shurman v. Atlantic Mortgage, where an inmate's usual place of abode was held to be the prison.` },

  { title:'Sunday service & the service clock', icon:'📅', content:
`☀️ SUNDAY SERVICE (§48.20)
Service or execution on a SUNDAY of any writ, process, warrant, order, or judgment is VOID, and the person who serves it is liable to the aggrieved party for damages as if there had been no process at all.

THE ONLY EXCEPTION: if the person REQUESTING service makes an AFFIDAVIT that they have good reason to believe the person intends to ESCAPE FROM THIS STATE under protection of Sunday, then an officer furnished with an ORDER from the TRIAL COURT JUDGE may serve on Sunday, and it is as valid as any other day.

It is not a general "urgency" exception. Client pressure never qualifies.

⏰ SERVICE DEADLINES
• FLORIDA STATE COURT → 120 DAYS from filing (Fla. R. Civ. P. 1.070(j))
• FEDERAL COURT → 90 DAYS from filing (Fed. R. Civ. P. 4(m))
• FLORIDA SMALL CLAIMS → 120 DAYS (Fla. Sm. Cl. R. 7.070(b), adopted 2026 to match Rule 1.070(j))

⚠️ When a deadline is close, notify the attorney so they can seek an extension.` }],

{
  id:3, emoji:'📋', title:'Return of Service & Non-Service', subtitle:'Proper vs. improper affidavits',
  color:'var(--green)', bg:'var(--green-bg)', read:'8 min',
  lessons:[
  { title:'The return of service', icon:'📝', content:
`After serving, you file a Return of Service with the court. It is your sworn proof.

WHAT MUST BE IN IT (§48.21(1))
• The DATE the process came to hand
• The TIME it came to hand
• The DATE it was served
• The TIME it was served
• The MANNER of service
• The NAME of the person served
• If served in a representative capacity, the POSITION that person occupies
• A LIST of all pleadings and documents served
• Your SIGNATURE — an electronic signature is allowed if you are authorized under Chapter 48 to serve process

CPS-SPECIFIC (§48.29(6))
A certified process server must place the §48.031(5) information on the FIRST PAGE of at least one of the processes served, and must make the return of service ON A FORM THAT HAS BEEN REVIEWED AND APPROVED BY THE COURT.

⚠️ Circuits also issue administrative orders adding local requirements. Use the NINTH CIRCUIT's own current administrative order and approved form — do not rely on another circuit's order.

WHAT HAPPENS IF SOMETHING IS MISSING (§48.21(2))
• Failure to state the facts or include the signature INVALIDATES the service
• BUT the return is AMENDABLE at any time on application to the court that issued the process
• On amendment, service is as effective as if the return had been correct from the start
• The omission subjects the server to a fine NOT EXCEEDING $10, in the court's discretion

🔑 Courts presume a facially valid return is correct — evidence can rebut that presumption. Accuracy matters.

For substitute service, courts check:
1. Was it the defendant's usual place of abode?
2. Was the person 15 or older?
3. Did they reside there?
4. Were they informed of the contents?` },

  { title:'Real case law — usual place of abode', icon:'⚖️', content:
`"Usual place of abode" is one of the most heavily litigated ideas in Chapter 48.

📍 DEFINITION: the place where the person is ACTUALLY LIVING at the time service is made. One usual place of abode at a time, even with multiple properties.

⚠️ "RESIDENCE" ≠ "USUAL PLACE OF ABODE": you can legally reside somewhere without currently living there.

🏛️ CASES TO KNOW
Shurman v. Atlantic Mortgage & Investment Corp. (Fla. 2001) — an inmate's usual place of abode was the prison, not the home he shared with his wife before incarceration.

Robles-Martinez v. Diaz, Reus & Targ (Fla. 3d DCA 2011) — substitute service provisions must be STRICTLY COMPLIED WITH and are STRICTLY CONSTRUED.

Stern v. Gad — serving the wife at a condo the husband owned was not valid abode service where he proved by affidavit he did not live in the U.S. at the time.

Ward v. Gibson — a leased PARKING SPACE in a garage was not a usual place of abode.

Rokeach v. Glickstein — holding papers to a car window while the driver fled was VALID, because the server identified himself and described the documents.

Speer v. Wooddell — a houseguest of roughly a year WAS a proper person for substitute service.

Couts v. Maryland Casualty Co. — a mother-in-law who was only VISITING was not.

Baker v. Stearns Bank — a housekeeper who does not reside there is not.

Schupak v. Sutton Hill Assocs. — a building DOORMAN in the lobby is not.

Johnston v. Halliday — valid substitute service requires proof of (a) the usual place of abode, (b) the identity of the person served, (c) whether they were 15+, (d) whether they actually resided there, (e) whether they were informed of contents.

🔑 EXAM TIP: if someone owns a home but doesn't currently live there, the answer points to where they ACTUALLY live.` },

  { title:'Non-service & the diligence standard', icon:'🔍', content:
`Sometimes you cannot complete service. That is acceptable — what is not acceptable is failing to document.

⚖️ WHAT THE STATUTE ACTUALLY SAYS (§48.161(5))
A party is considered to have used DUE DILIGENCE if that party:
(a) made diligent inquiry and exerted an honest and conscientious effort appropriate to the circumstances to acquire the information needed for personal service;
(b) reasonably employed the knowledge at their command; and
(c) made AN APPROPRIATE NUMBER OF ATTEMPTS, TAKING INTO ACCOUNT THE PARTICULAR CIRCUMSTANCES, during such times when and where the party is reasonably likely to be found.

⚠️ Note what is NOT there: a fixed number. If an answer choice says "an appropriate number under the circumstances," that is the statutory standard. Three or more attempts at varied times is common professional practice and what most courts expect in practice — but it is practice, not a statutory minimum.

YOUR NON-SERVICE AFFIDAVIT SHOULD SHOW
• Every attempt: exact date, time, address
• What you observed (lights, vehicles, mail)
• Why service could not be completed
• Information gathered about the defendant's whereabouts

⚠️ Attempting only at the SAME time every day is not a conscientious effort appropriate to the circumstances.

AFTER NON-SERVICE — notify the attorney immediately. They may skip trace, seek constructive service, or ask the court for more time.

🚨 NEVER mark service complete if it was not completed. False return is a felony (§48.31(2)).` },

  { title:'When personal service fails — the alternatives', icon:'📰', content:
`Your documentation is what unlocks every one of these.

📄 SECRETARY OF STATE (§48.161) — for nonresidents, concealed parties, and entities where the statute authorizes it
• Send process to the office of the Secretary of State by personal delivery, registered mail, certified mail return receipt requested, a commercial delivery firm, or ELECTRONIC TRANSMISSION
• ALSO send notice of service and a copy of the process to the party at their last known physical address (and last known electronic address if the parties have recently and regularly used email between themselves)
• File an AFFIDAVIT OF COMPLIANCE within 40 DAYS after the date of service on the Secretary of State, or within such additional time as the court allows
• Service is EFFECTUATED on the date the affidavit of compliance is filed, or the date the notice requirements are completed — WHICHEVER IS LATER (§48.161(8))

🖥️ SERVICE BY OTHER MEANS (§48.102)
For corporations, general partnerships, LLPs, LPs, LLLPs, and LLCs only: if after due diligence personal service can't be made, the court on motion may authorize any other manner reasonably effective to give ACTUAL NOTICE — including service by EMAIL or other technology, by a person authorized to serve process or by an attorney.

📰 SERVICE BY PUBLICATION — CHAPTER 49, NOT CHAPTER 48
• Attorney files a diligent search affidavit
• Court approves publication
• Notice published in a designated newspaper, once a week for the required number of weeks
• Proof of publication filed
• Last resort only` }],

{
  id:4, emoji:'📜', title:'Court Rules', subtitle:'Rule 1.070, Rule 7.070 & your authority',
  color:'var(--orange)', bg:'var(--orange-bg)', read:'7 min',
  lessons:[
  { title:'Rule 1.070 — the 120-day rule', icon:'⏱️', content:
`Florida Rule of Civil Procedure 1.070 governs process in Florida state court. Still current as of the April 1, 2026 rules.

ISSUANCE (1.070(a)): on the commencement of the action, summons or other process must be promptly issued by the clerk or judge under their signature and the seal of the court, and delivered for service.

SERVICE; BY WHOM MADE (1.070(b)): service may be made by an officer authorized by law to serve process, but the court may appoint any competent person not interested in the action to serve the process. §48.27(3) confirms this appointment route stays open alongside the CPS list.

⏰ THE 120-DAY RULE (1.070(j))
If service of the initial process and initial pleading is not made on a defendant within 120 DAYS after filing of the initial pleading directed to that defendant, the court — on its own initiative after notice, or on motion — must either direct that service be effected within a specified time, or dismiss the action without prejudice, or drop that defendant as a party. If the plaintiff shows GOOD CAUSE or EXCUSABLE NEGLECT, the court MUST extend the time.

When a motion for leave to amend with an attached proposed amended complaint is filed, the 120-day period for serving new parties begins on the ENTRY OF THE ORDER granting leave to amend.

A dismissal under this subdivision is not a voluntary dismissal and is not an adjudication on the merits.

🔑 PROCESS RUNS STATEWIDE (§48.011): summons, subpoenas, and other process in civil actions run throughout the state. All process except subpoenas is directed to all and singular the sheriffs of the state.` },

  { title:'Your authority as a CPS — §48.27 & §48.29', icon:'🎓', content:
`Your authority comes from the Florida Certified Process Server Act, §§48.25–48.31 (§48.25 is the short title).

📌 A NOTE ON RULE NUMBERS
Some circuit websites list "Florida Rules of Civil Procedure 1.070 and 1.808" for process servers; others list "1.070 and 1.080." The substance of what a CPS may do is set by STATUTE, not by that rule. Learn §48.27 and §48.29 — and if a practice question references a rule number for CPS authority, confirm which numbering your course materials use.

WHAT §48.27(2) AUTHORIZES
(a) To serve INITIAL NONENFORCEABLE CIVIL PROCESS on a person found within the circuit where you are certified, when a civil action has been filed against that person in the circuit court or in a county court in the state.
(b) To serve CRIMINAL WITNESS SUBPOENAS and CRIMINAL SUMMONSES on a person found within your circuit.

• "Initial" = the first papers in a case
• "Nonenforceable" = delivering notice, not enforcing a judgment

❌ NOT YOURS TO SERVE
• Arrest warrants
• Writs of execution
• Writs of possession (the sheriff executes these)

🔁 §48.27(1): you are subject to ANNUAL recertification and reappointment by the chief judge.
💵 §48.29(8): a certified process server MAY charge a fee for services.
🌐 §48.29(7): you may be certified in more than one circuit, may serve in any circuit where you are listed, and may serve FOREIGN PROCESS in any circuit where you are listed.

🆔 Carry your ID card. It shows your ID number, printed name, signature, photograph, the seal of the circuit court, and an expiration date. Expired card = no longer authorized.` },

  { title:'Rule 7.070 — small claims', icon:'💰', content:
`Florida Small Claims Rule 7.070 governs service in small claims court. Small claims covers actions at law in county court where the demand does not exceed $8,000, exclusive of costs, interest, and attorney fees (Rule 7.010(b)).

RULE 7.070(a) — METHOD
• Service is effected as provided by law, or as provided by Fla. R. Civ. P. 1.070(a)–(h)
• Constructive or substituted service may be effected as provided by law
• Service on FLORIDA RESIDENTS ONLY may ALSO be effected by CERTIFIED MAIL, with the return receipt signed by the defendant or by someone authorized to receive mail at the defendant's residence or principal place of business
• EITHER THE CLERK OR AN ATTORNEY OF RECORD may mail the certified mail, at a cost in addition to the filing fee

⚠️ Two things people get wrong: certified mail service is NOT available for out-of-state defendants, and the clerk is not the only one who can mail it.

RULE 7.070(b) — SUMMONS; TIME LIMIT
The Florida Supreme Court adopted a new subdivision (b) in 2026 giving small claims a 120-DAY service limit, in alignment with Fla. R. Civ. P. 1.070(j).

SAME RULES STILL APPLY
• Sunday prohibition
• Return of service requirements
• The 15-year-old substitute service requirement

⚠️ You will see small claims constantly — landlord/tenant, small debts, minor damages.` }],

{
  id:5, emoji:'🇺🇸', title:'Federal Rules — FRCP 4', subtitle:'Federal service of process',
  color:'var(--teal)', bg:'var(--teal-bg)', read:'6 min',
  lessons:[
  { title:'Federal Rule 4 — the basics', icon:'🏛️', content:
`Federal Rule of Civil Procedure 4 governs service in federal court.

WHAT A FEDERAL SUMMONS MUST INCLUDE (Rule 4(a))
• Court name
• Names of all parties
• Plaintiff's attorney name and address
• The time within which the defendant must appear and defend
• A warning that failure to appear means DEFAULT JUDGMENT
• The clerk's signature and the court's seal

WHO MAY SERVE (Rule 4(c)): any person who is AT LEAST 18 and NOT A PARTY.

🔑 THE CONTRAST
• FLORIDA STATE: sheriff, special process server, or certified process server
• FEDERAL: any non-party 18 or older

⏱️ RESPONSE TIME
• FORMALLY SERVED → 21 days to answer
• WAIVED SERVICE → 60 days (90 if the request was sent outside the U.S.)` },

  { title:'Deadlines, methods & waiver', icon:'⏰', content:
`THE 90-DAY DEADLINE (Rule 4(m))
Service must be completed within 90 DAYS of filing. If missed, the court dismisses without prejudice or orders service within a set time — unless the plaintiff shows GOOD CAUSE.

INDIVIDUALS (Rule 4(e))
1. Follow the law of the state where the district court sits or where service is made — in Florida, that means Chapter 48
2. Personal delivery
3. Leave at the dwelling with someone of suitable age and discretion who resides there
4. Deliver to an authorized agent

CORPORATIONS (Rule 4(h))
1. Follow state law, OR
2. Deliver to an officer, a managing or general agent, or an authorized agent

WAIVER OF SERVICE (Rule 4(d)) — FEDERAL ONLY
• Plaintiff MAILS a waiver request to the defendant
• If the defendant signs and returns it, no personal service is needed
• The defendant must be given at least 30 DAYS to return the form
• Waiving buys the defendant more time to answer: 60 days domestic, 90 international
• A defendant who refuses without good cause must PAY the costs of service

🔑 Waiver of service does NOT exist in Florida state court.` },

  { title:'Serving the government in federal court', icon:'🏛️', content:
`A favorite exam topic, because it requires more than one recipient.

⭐ SERVING THE UNITED STATES (Rule 4(i)) — do BOTH
1. Deliver to the U.S. Attorney for the district (or a designated assistant or clerical employee), OR send by registered or certified mail to the civil-process clerk at the U.S. Attorney's office; AND
2. Send a copy by registered or certified mail to the U.S. ATTORNEY GENERAL in Washington, D.C.

⭐ A U.S. AGENCY OR OFFICER SUED IN OFFICIAL CAPACITY
Serve the United States (both steps above) AND mail a copy to the agency, officer, or employee.

⭐ A FEDERAL OFFICER SUED INDIVIDUALLY
Serve the United States AND serve that person under the ordinary individual-service rules.

⭐ STATE OR LOCAL GOVERNMENT (Rule 4(j)(2))
Deliver to its CHIEF EXECUTIVE OFFICER, or serve in the manner prescribed by that state's law.

🔑 For the U.S. government the theme is: you always also serve the United States.` },

  { title:'Florida vs. federal — side by side', icon:'⚡', content:
`SERVICE DEADLINE
• Florida state → 120 DAYS (Rule 1.070(j))
• Federal → 90 DAYS (Rule 4(m))

WHO MAY SERVE
• Florida → sheriff, special process server, certified process server
• Federal → any non-party 18+

WAIVER OF SERVICE
• Florida → does not exist
• Federal → Rule 4(d)

TIME TO ANSWER
• Florida state → 20 days after service (Fla. R. Civ. P. 1.140(a))
• Federal, served → 21 days
• Federal, waived → 60 days (90 abroad)

SUBSTITUTE SERVICE AGE
• Florida → person residing there, 15 or older
• Federal → person of suitable age and discretion residing there (no fixed number)

SUNDAY SERVICE
• Florida → void under §48.20 absent a judge's order on a flight-risk affidavit
• Federal → no equivalent Sunday bar in Rule 4` }],

  { title:'Subpoenas — two types, two service rules', icon:'📋', content:
`📋 SUBPOENA AD TESTIFICANDUM — commands a person to APPEAR AND TESTIFY in court or at a deposition.
📄 SUBPOENA DUCES TECUM — commands a person to PRODUCE documents, records, or evidence.

GENERAL RULE (§48.031(3)(a)): witness subpoenas, criminal or civil, are served as provided in §48.031(1) — personal or abode substitute service.

📬 THE MAIL EXCEPTION (§48.031(3)(a))
A subpoena on a witness in a CIVIL TRAFFIC case, a CRIMINAL TRAFFIC case, a MISDEMEANOR case, or a SECOND OR THIRD DEGREE FELONY may be served by U.S. MAIL to the last known address, mailed AT LEAST 7 DAYS before the required appearance.
Failure to appear in response to a subpoena served by U.S. mail that is NOT CERTIFIED may not be grounds for contempt.

📌 THE POSTING RULE (§48.031(3)(b)) — know both halves
• COURT APPEARANCE: may be posted at the witness's residence after THREE attempts, made at different times of the day or night on different dates, have failed.
• DEPOSITION: may be posted after ONE attempt has failed.
• AND IN BOTH CASES: the subpoena must be posted AT LEAST 5 DAYS before the date of the required appearance.

👮 LAW ENFORCEMENT & GOVERNMENT WITNESSES (§48.031(4)(a))
A criminal witness subpoena on an officer or a federal, state, or municipal employee testifying in an official capacity may be served under §48.031(1) OR by delivery to a designated supervisory or administrative employee at the witness's place of employment — if the agency head has designated someone to accept service. That designee need not accept if the witness no longer works there, is not scheduled to work before the appearance date, or the appearance date is LESS THAN 5 DAYS from the date of service.` },

  { title:'Writs — sheriff vs. CPS', icon:'⚡', content:
`❌ SHERIFF ONLY — NOT YOU
• WRIT OF POSSESSION — the sheriff removes occupants after an eviction judgment (§48.184(6) names the sheriff expressly)
• WRIT OF EXECUTION — seizing a debtor's property to satisfy a judgment
• ARREST WARRANTS

✅ WITHIN A CPS ROLE
• WRIT OF GARNISHMENT — serving the initial notice on an employer or bank
• INJUNCTIONS — delivering notice of a restraining order
• NOTICE TO APPEAR in small claims

🔑 RULE OF THUMB
ENFORCING a judgment (seizing property, removing occupants, arrests) → SHERIFF
DELIVERING NOTICE of legal action → CPS

⏱️ INJUNCTIONS ARE TIME-SENSITIVE: an injunction does not bind the defendant until they are properly served. That is why injunction service is urgent.` },

  { title:'Evictions — §48.183 posting', icon:'🏘️', content:
`Possession cases are constant work in Orange and Osceola County. Learn this section precisely.

📬 THE 3-DAY NOTICE: the landlord's pre-suit notice to pay or vacate. Not court process, but landlords often hire servers to deliver it.

🏛️ §48.183(1) — WHEN YOU MAY POST
In an action for possession of residential premises (including under chapters 83, 723, and 513) or nonresidential premises, if:
• the TENANT CANNOT BE FOUND in the county, OR
• there is NO PERSON 15 YEARS OF AGE OR OLDER residing at the tenant's usual place of abode in the county,
AFTER AT LEAST TWO ATTEMPTS to obtain service,
then the summons may be served by ATTACHING A COPY TO A CONSPICUOUS PLACE on the property described in the complaint or summons.

⏱️ THE MINIMUM TIME DELAY BETWEEN THE TWO ATTEMPTS IS 6 HOURS. This number is tested.

📮 §48.183(2) — WHO MAILS IT
If the landlord causes or anticipates service solely by posting, THE LANDLORD provides the CLERK OF THE COURT with an additional copy of the complaint and a PRESTAMPED ENVELOPE addressed to the defendant at the premises. THE CLERK immediately mails it by first-class mail, notes the mailing in the docket, and files a certificate of the fact and date of mailing.

You post. The clerk mails. Do not describe this as "you post and you mail."

📅 EFFECTIVE DATE: service is effective on the date of POSTING or MAILING, WHICHEVER OCCURS LATER — and at least 5 DAYS must elapse from the date of service before a judgment for final removal may be entered.

⚠️ This posting method is for POSSESSION cases only. Nothing in §48.183 prohibits serving a tenant the ordinary way.` },

  { title:'Unknown parties in possession — §48.184', icon:'🚪', content:
`A newer section (added 2022, amended 2023) that shows up in eviction work.

WHEN IT APPLIES (§48.184(1)): only to actions under §82.03, §83.21, §83.59, or §723.061, and only for removing an UNKNOWN PARTY OR PARTIES IN POSSESSION.

THE SUMMONS (§48.184(2)): issued in the name of "Unknown Party or Parties in Possession" when the occupant's name is not known to the plaintiff.

📌 THE THREE-ATTEMPT PATTERN (§48.184(3)) — memorize the pattern, not just the number
If service on the unknown occupant is not effectuated on the first attempt, at least TWO ADDITIONAL attempts must be made. The three attempts must be made:
• ONCE DURING BUSINESS HOURS
• ONCE DURING NONBUSINESS HOURS
• ONCE DURING A WEEKEND

You must INQUIRE as to the occupant's name at the time of service. The return must note the name of every occupant obtained, or state that the name could not be obtained after inquiry.

ALSO REQUIRED (§48.184(4)) — BOTH:
(a) attach a copy of the summons and complaint to a conspicuous location on the premises; AND
(b) the plaintiff gives the clerk an extra copy and a prestamped envelope for each unknown occupant, and THE CLERK mails it first class.

EFFECTIVE (§48.184(5)): the LATEST of personal service, posting, or the clerk's mailing.

⚖️ §48.184(6): the WRIT OF POSSESSION is executed by the SHERIFF.` }],

• Criminal witness subpoena by mail → mailed at least 7 DAYS before appearance
• Criminal witness subpoena posting → 3 attempts (court) / 1 attempt (deposition); posted at least 5 DAYS before appearance
• Government-employee witness → a designee need not accept if the appearance date is LESS THAN 5 DAYS from service
• Eviction posting under §48.183 → 2 attempts, MINIMUM 6 HOURS apart; 5 DAYS must elapse before final removal judgment

  id:8, emoji:'🧭', title:'Ethics, Safety & Business', subtitle:'Being a professional',

  { title:'Ethics & conduct', icon:'⚖️', content:
`Your return of service is sworn testimony. Ethics are the whole job.

✅ HONESTY — every word on a return must be accurate.

✅ DISINTEREST (§48.31(2)) — a certified process server MUST be disinterested in any process served. No personal or financial stake. Not your landlord, not your ex, not someone who owes you money.

✅ CONFIDENTIALITY — you see sensitive legal information. Keep it private.

✅ NO FALSE RETURNS — §48.31(2): a certified process server who WILLFULLY AND KNOWINGLY executes a false return of service is guilty of a FELONY OF THE THIRD DEGREE (punishable under §775.082, §775.083, or §775.084) and is PERMANENTLY BARRED from serving process in this state. The parallel provision for special process servers is §48.021(4).

✅ REMOVAL (§48.31(1)) — you can be removed from the list for malfeasance, misfeasance, neglect of duty, or incompetence, as provided by court rule. That is a lower bar than a criminal charge.

✅ PROFESSIONAL CONDUCT — you represent the court. Stay calm, don't argue, don't threaten. If it turns hostile, leave and document.

THE DEFENDANT WHO REFUSES THE PAPERS
They cannot escape service by refusing. Place the papers down near them, state clearly what they are, and document exactly what happened. Courts have upheld this.

FAPPS CODE OF ETHICS covers truthfulness in returns and affidavits, avoiding conflicts of interest, professional conduct, and reporting misconduct by other servers.` },

  { title:'Immunity from service', icon:'🛡️', content:
`Some people are protected from service in certain circumstances. Both of these come from case law and general legal doctrine rather than Chapter 48 — they will not be found by searching the statute.

🌍 DIPLOMATIC IMMUNITY
Ambassadors, consuls, and foreign ministers are generally immune from service while serving in their official capacity, under international law and federal statute.

⚖️ COURTHOUSE WITNESS IMMUNITY
A nonresident who travels to another jurisdiction ONLY to attend court in an UNRELATED matter is immune from being served new papers for a reasonable period before, during, and after the appearance.

WHY: so people are not deterred from showing up to court.

⚠️ THE EXCEPTION: the immunity does not apply when the new case involves the SAME PARTIES AND ISSUES already before the court.

🔑 EXAM TIP: if a question describes someone traveling to testify in an unrelated case and being handed brand-new papers, the answer is usually that the service is invalid — unless the new case connects to the same parties and issues.` },

  { title:'Safety while serving', icon:'🦺', content:
`You are often delivering unwelcome news to people who may be upset.

BEFORE YOU GO
• Research the area
• Know your route and an exit
• Tell someone where you're going
• Charge your phone

AT THE DOOR
• Stand to the SIDE, not centered in front of the door
• Have ID ready but confirm the person first
• Keep body language neutral
• Never put your foot in the door

IF IT TURNS HOSTILE
• Don't escalate
• If threatened, LEAVE. Your safety comes first
• Document everything
• Report threats to law enforcement
• Notify the hiring attorney

🔑 FAPPS VIOLENCE REPORT: FAPPS maintains a report where servers log dangerous situations. Use it — it protects you and everyone else working the same addresses.

⚠️ NEVER enter a private home without permission. You serve at the door.` },

`RECORD KEEPING
• Log every attempt — date, time, address, observations
• Photograph the address at service
• Keep copies of all returns
• Track mileage for taxes
• Keep invoices and payment records

YOUR ID CARD (§48.29(5)(b))
• Carry it whenever you serve
• Your ID number goes on the first page of at least one process served (§48.031(5))
• Expired card = not authorized
• Renewable annually on proof of good standing AND CURRENT BOND

YOUR BOND (§48.29(3)(g))
$5,000 with a surety company authorized to do business in Florida, for the benefit of anyone wrongfully injured by your malfeasance, misfeasance, neglect of duty, or incompetence. RENEWABLE ANNUALLY. Let it lapse and your ID card cannot be renewed.

WORKING WITH ATTORNEYS
• Confirm special instructions before you go out
• Failed service? Notify immediately
• Ask about deadlines up front
• Return completed paperwork fast

YOUR FEES (§48.29(8))
A certified process server MAY charge a fee for services. Put your fee schedule in writing and invoice promptly.

🔑 Attorneys re-hire servers they trust. Reliable, accurate, communicative — that is the whole business model. 👑` }],

/* ============================================================
   KEY TERMS
   ============================================================ */
var KEY_TERMS = [
{term:'SUMMONS',definition:'A court document telling someone they have been sued and must respond to the complaint.'},
{term:'SUBPOENA',definition:'A court order commanding a person to appear or to produce documents.'},
{term:'PROCESS',definition:'Official court documents that command a person to act. Under §48.011, process in civil actions runs throughout the state.'},
{term:'PLAINTIFF',definition:'The party who files a lawsuit and initiates the action.'},
{term:'DEFENDANT',definition:'The party being sued or served with legal process.'},
{term:'AFFIDAVIT',definition:'A written statement made under oath. Your return of service functions as sworn testimony.'},
{term:'AFFIDAVIT OF COMPLIANCE',definition:'The filing required within 40 days after service on the Secretary of State, showing due diligence and the basis for substituted service (§48.161(3)).'},
{term:'INJUNCTION',definition:'A court order requiring someone to stop a specific action. It does not bind the defendant until properly served.'},
{term:'WRIT',definition:'A court order commanding a specific action, such as seizing property or removing occupants.'},
{term:'WRIT OF POSSESSION',definition:'The order restoring possession of premises after an eviction judgment. Executed by the SHERIFF (§48.184(6)).'},
{term:'GARNISHMENT',definition:"A court order directing a third party — an employer or bank — to hold a debtor's money or property."},
{term:'DUE DILIGENCE',definition:'Defined in §48.161(5): diligent inquiry, an honest and conscientious effort appropriate to the circumstances, and an appropriate number of attempts at times and places the party is likely to be found.'},
{term:'USUAL PLACE OF ABODE',definition:'Where the person is actually living at the time of service. One at a time, even with multiple properties.'},
{term:'REGISTERED AGENT',definition:'The person or entity designated to receive legal documents for a business or public agency. Under current law, the first target for corporations, LLCs, LLPs, LPs, and public agencies.'},
{term:'REGISTERED OFFICE',definition:'The address where the registered agent must be available at least 10 a.m.–12 noon and 2 p.m.–4 p.m. on business days (§48.091(3)).'},
{term:'VIRTUAL OFFICE',definition:'Per §48.031(6)(b): an office providing communications and address services with no dedicated office space, all communications routed through a common receptionist.'},
{term:'EXECUTIVE OFFICE OR MINI SUITE',definition:'Per §48.031(6)(b): communications services plus a DEDICATED office space and other supportive services, routed through a common receptionist.'},
{term:'JURISDICTION',definition:'A court\u2019s legal authority to act over a person or subject. Proper service is what establishes personal jurisdiction.'},
{term:'CIRCUIT',definition:'A judicial district. The 9th Circuit covers Orange County and Osceola County.'},
{term:'SURETY BOND',definition:'The $5,000 bond required by §48.29(3)(g), renewable annually, for the benefit of anyone wrongfully injured by a server\u2019s malfeasance, misfeasance, neglect of duty, or incompetence.'},
{term:'AD TESTIFICANDUM',definition:'A subpoena commanding a person to appear and TESTIFY.'},
{term:'DUCES TECUM',definition:'A subpoena commanding a person to PRODUCE documents or records.'},
{term:'NON-SERVICE',definition:'When service cannot be completed. Documented with every attempt and filed with the court.'},
{term:'ALIAS SUMMONS',definition:'A second summons issued when the first could not be served.'},
{term:'PLURIES SUMMONS',definition:'The third or later summons issued in the same case.'},
{term:'LIS PENDENS',definition:'A recorded notice under §48.23 that a lawsuit is pending which may affect specific property. Not effective beyond 1 year absent a recorded instrument or a chapter 713 lien.'},
{term:'SPECIAL PROCESS SERVER',definition:'Appointed by a county sheriff under §48.021; authorized only in that sheriff\u2019s county. Narrower than a certified process server.'},
{term:'CERTIFIED PROCESS SERVER',definition:'Appointed by the chief judge of a circuit under §§48.27 and 48.29; serves initial nonenforceable civil process, criminal witness subpoenas, and criminal summonses within that circuit.'},
{term:'INITIAL NONENFORCEABLE CIVIL PROCESS',definition:'The first papers in a civil case, delivering notice rather than enforcing a judgment. The core of CPS authority under §48.27(2)(a).'},
{term:'WAIVER OF SERVICE',definition:'A federal-only procedure under FRCP 4(d) where a defendant gives up formal service in exchange for more time to answer. Does not exist in Florida state court.'}];

{q:"What is 'service of process'?",a:'Officially delivering court documents to notify a person of legal action. Required by due process, and what gives the court jurisdiction.',cat:'Basics'},

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === 'class') n.className = attrs[k];
    else if (k === 'style') n.setAttribute('style', attrs[k]);
    else if (k.slice(0,2) === 'on') n[k] = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9%]/g,''); }
function go(v){ S.view = v; render(); window.scrollTo(0,0); }

function allQuestions(){
  var out = [];
  MODULES.forEach(function(m){ m.quiz.forEach(function(q){ out.push(q); }); });
  SCENARIOS.forEach(function(s){ out.push({q:s.question + ' — ' + s.title.replace(/^\S+\s/,''), options:s.options, correct:s.correct, explain:s.explain}); });
  return out;
}

function navGo(item){
  S.navOpen = false;
  if (item.modId){ S.moduleId = item.modId; S.lessonOpen = {}; go('module'); return; }
  if (item.id === 'finalquiz'){
    S.quiz = { pool: shuffle(allQuestions()).slice(0,40), i:0, picked:null, right:0, source:'final' };
    go('quiz'); return;
  }
  if (item.id === 'home'){ go('home'); return; }
  S.practice = { mode:item.id, i:0, flipped:false, val:'', shown:false, picked:null, right:0 };
  go(item.id);
}

function buildNav(){
  var nav = el('nav',{class:'sidenav'+(S.navOpen?' open':'')});
  nav.appendChild(el('div',{class:'closerow'},[
    el('b',{text:'Sections'}),
    el('button',{text:'Close ✕',onclick:function(){ S.navOpen=false; render(); }})
  ]));
  NAV.forEach(function(g){
    nav.appendChild(el('div',{class:'navgroup',text:g.group}));
    g.items.forEach(function(it){
      var active = (it.modId && S.view==='module' && S.moduleId===it.modId) ||
                   (!it.modId && S.view===it.id) ||
                   (it.id==='home' && S.view==='home');
      var done = it.modId && S.completed.indexOf(it.modId) > -1;
      nav.appendChild(el('button',{class:'navitem'+(active?' active':''),onclick:function(){ navGo(it); }},[
        el('span',{class:'ic',text:it.icon}),
        el('span',{text:it.label}),
        done ? el('span',{class:'tick',text:'✓'}) : null
      ]));
    });
  });
  return nav;
}

  ]);
  var stats = el('div',{class:'grid2',style:'margin-top:12px'},[
    el('div',{class:'stat'},[ el('b',{text:String(S.finalBest)+'%'}), el('span',{text:'Best final exam'}) ]),
    el('div',{class:'stat'},[ el('b',{text:String(allQuestions().length)}), el('span',{text:'Practice questions'}) ])
  ]);
  card.appendChild(stats);
  w.appendChild(card);

  w.appendChild(el('button',{class:'btn gold',text:'⚡  Practice & drills',onclick:function(){ go('practice'); }}));
  w.appendChild(el('div',{style:'height:22px'}));

  w.appendChild(el('div',{class:'pagetitle',text:'The 8 modules'}));
  var grid = el('div',{class:'modgrid'});

  MODULES.forEach(function(m){
    var done = S.completed.indexOf(m.id) > -1;
    var sc = S.scores[m.id];
    var b = el('button',{class:'modbtn',style:'border-color:'+(done?'var(--green)':'var(--border)'),onclick:function(){ S.moduleId=m.id; S.lessonOpen={}; go('module'); }},[
      el('span',{class:'emoji',text:m.emoji}),
      el('span',{},[
        el('span',{class:'t',text:m.title}),
        el('span',{class:'s',text:m.subtitle}),
        el('span',{class:'meta',style:'color:'+m.color,
          text: m.read + ' · ' + m.lessons.length + ' lessons · ' + m.quiz.length + ' questions' + (sc!==undefined ? ' · scored '+sc+'%' : '')})
      ]),
      el('span',{class:'done',text: done ? '✅' : ''})
    ]);
    grid.appendChild(b);
  });
  w.appendChild(grid);

  w.appendChild(el('div',{class:'note',html:'Content verified against the 2025 Florida Statutes, Fla. R. Civ. P. 1.070, Fla. Sm. Cl. R. 7.070, and the Ninth Circuit\u2019s published CPS requirements.<br>Reviewed August 2026. Statutes change — confirm anything critical against flsenate.gov before you rely on it.'}));

  return [header('Process Server Study','Florida Chapter 48 · Ninth Judicial Circuit'), w];
}

function viewModule(){
  var m = MODULES.filter(function(x){ return x.id === S.moduleId; })[0];
  var w = el('div',{});

  m.lessons.forEach(function(L, i){
    var open = !!S.lessonOpen[i];
    var box = el('div',{class:'lesson',style:'border-color:'+(open?m.color:'var(--border)')});
    box.appendChild(el('button',{onclick:function(){ S.lessonOpen[i] = !open; render(); }},[
      el('span',{style:'font-size:21px',text:L.icon}),
      el('span',{style:'font-family:Fraunces,serif;font-size:16.5px',text:L.title}),
      el('span',{class:'chev',text: open ? '▲' : '▼'})
    ]));
    if (open) box.appendChild(el('div',{class:'body',text:L.content}));
    w.appendChild(box);
  });

  w.appendChild(el('div',{style:'height:8px'}));
  w.appendChild(el('button',{class:'btn gold',text:'Take the module quiz  ('+m.quiz.length+' questions)',onclick:function(){
    S.quiz = { pool:m.quiz, i:0, picked:null, right:0, source:'module', modId:m.id };
    go('quiz');
  }}));

  return [header(m.emoji+'  '+m.title, m.subtitle, 'home'), w];
}

function viewQuiz(){
  var q = S.quiz;
  var w = el('div',{class:'qwrap'});
  var item = q.pool[q.i];

  w.appendChild(el('div',{style:'display:flex;justify-content:space-between;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px'},[
    el('span',{text:'Question '+(q.i+1)+' of '+q.pool.length}),
    el('span',{text:q.right+' correct'})
  ]));
  w.appendChild(el('div',{class:'bar',style:'margin-bottom:16px'},[
    el('i',{style:'width:'+Math.round((q.i/q.pool.length)*100)+'%;background:var(--gold)'})
  ]));

  w.appendChild(el('div',{class:'card'},[ el('h3',{text:item.q}) ]));

  item.options.forEach(function(opt, oi){
    var cls = 'opt';
    if (q.picked !== null){
      if (oi === item.correct) cls += ' correct';
      else if (oi === q.picked) cls += ' wrong';
      else cls += ' dim';
    }
    w.appendChild(el('button',{class:cls,text:opt,onclick:function(){
      if (q.picked !== null) return;
      q.picked = oi;
      if (oi === item.correct) q.right++;
      render();
    }}));
  });

  if (q.picked !== null){
    var ok = q.picked === item.correct;
    w.appendChild(el('div',{class:'explain '+(ok?'ok':'no'),style:'margin-top:12px'},[
      el('b',{text: ok ? '✅ Correct — ' : '❌ Not quite — '}),
      document.createTextNode(item.explain)
    ]));
    var last = q.i === q.pool.length - 1;
    w.appendChild(el('button',{class:'btn',text: last ? 'See your results' : 'Next question',onclick:function(){
      if (last){ finishQuiz(); } else { q.i++; q.picked = null; render(); }
    }}));
  }

  return [header('Quiz', q.source === 'final' ? 'Final exam practice' : 'Module '+q.modId, q.source==='final'?'practice':'module'), w];
}

function finishQuiz(){
  var q = S.quiz;
  var pct = Math.round((q.right / q.pool.length) * 100);
  q.finalPct = pct;
  if (q.source === 'module'){
    S.scores[q.modId] = pct;
    Store.set('jeps_scores', S.scores);
    if (pct >= 80 && S.completed.indexOf(q.modId) === -1){
      S.completed.push(q.modId);
      Store.set('jeps_completed', S.completed);
    }
  } else {
    if (pct > S.finalBest){ S.finalBest = pct; Store.set('jeps_finalBest', pct); }
  }
  go('result');
}

function viewResult(){
  var q = S.quiz, pct = q.finalPct;
  var pass = pct >= 80;
  var w = el('div',{class:'qwrap'});
  w.appendChild(el('div',{class:'card',style:'text-align:center;border-color:'+(pass?'var(--green)':'var(--red)')},[
    el('div',{style:'font-size:52px;line-height:1',text: pass ? '👑' : '📚'}),
    el('h2',{style:'font-family:Fraunces,serif;font-size:44px;font-weight:900;margin-top:6px',text:pct+'%'}),
    el('p',{style:'margin:6px 0 0;font-weight:700;color:'+(pass?'var(--green)':'var(--red)'),
      text: pass ? 'Passing — 80% is the Ninth Circuit standard' : 'Below 80% — review and run it again'}),
    el('p',{style:'margin:8px 0 0;font-size:14px;color:var(--muted)',text: q.right+' of '+q.pool.length+' correct'})
  ]));
  w.appendChild(el('button',{class:'btn gold',text:'Try again',onclick:function(){
    S.quiz = { pool: q.source==='final' ? shuffle(allQuestions()).slice(0,40) : q.pool, i:0, picked:null, right:0, source:q.source, modId:q.modId };
    go('quiz');
  }}));
  w.appendChild(el('button',{class:'btn ghost',text:'Back to home',onclick:function(){ go('home'); }}));
  return [header('Results', pass ? 'Nice work' : 'Keep going', 'home'), w];
}

function viewPractice(){
  var w = el('div',{});
  var modes = [
    {id:'flashcards', icon:'🃏', label:'Flashcards', desc:FLASHCARDS.length+' cards — tap to flip', color:'var(--blue)'},
    {id:'fillin', icon:'✏️', label:'Fill in the blank', desc:FILL_INS.length+' prompts — type the answer', color:'var(--orange)'},
    {id:'scenarios', icon:'🎭', label:'Real scenarios', desc:SCENARIOS.length+' situations with explanations', color:'var(--green)'},
    {id:'checklists', icon:'✅', label:'Field checklists', desc:CHECKLISTS.length+' tap-to-check lists', color:'var(--purple)'},
    {id:'keyterms', icon:'🔤', label:'Glossary', desc:KEY_TERMS.length+' terms and definitions', color:'var(--pink)'},
    {id:'finalquiz', icon:'🎯', label:'Final exam practice', desc:'40 mixed questions — need 80%', color:'var(--charcoal)'}
  ];
  var pgrid = el('div',{class:'modgrid'});
  modes.forEach(function(b){
    pgrid.appendChild(el('button',{class:'modbtn',onclick:function(){
      if (b.id === 'finalquiz'){
        S.quiz = { pool: shuffle(allQuestions()).slice(0,40), i:0, picked:null, right:0, source:'final' };
        go('quiz');
      } else { S.practice = { mode:b.id, i:0, flipped:false, val:'', shown:false, right:0 }; go(b.id); }
    }},[
      el('span',{class:'emoji',text:b.icon}),
      el('span',{},[ el('span',{class:'t',text:b.label}), el('span',{class:'s',text:b.desc}) ])
    ]));
  });
  w.appendChild(pgrid);
  return [header('Practice & drills','Six ways to review','home'), w];
}

function viewFlashcards(){
  var p = S.practice, c = FLASHCARDS[p.i];
  var w = el('div',{});
  w.appendChild(el('div',{style:'text-align:center;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px',
    text:'Card '+(p.i+1)+' of '+FLASHCARDS.length}));
  var f = el('div',{class:'flash',onclick:function(){ p.flipped = !p.flipped; render(); }},[
    el('div',{class:'cat',text:c.cat}),
    p.flipped ? el('div',{class:'a',text:c.a}) : el('div',{class:'q',text:c.q})
  ]);
  w.appendChild(f);
  w.appendChild(el('button',{class:'btn gold',text: p.flipped ? 'Show the question' : 'Reveal the answer',onclick:function(){ p.flipped=!p.flipped; render(); }}));
  w.appendChild(el('div',{class:'grid2',style:'margin-top:10px'},[
    el('button',{class:'btn ghost',text:'‹ Previous',onclick:function(){ p.i=(p.i-1+FLASHCARDS.length)%FLASHCARDS.length; p.flipped=false; render(); }}),
    el('button',{class:'btn ghost',text:'Next ›',onclick:function(){ p.i=(p.i+1)%FLASHCARDS.length; p.flipped=false; render(); }})
  ]));
  w.appendChild(el('button',{class:'btn ghost',style:'margin-top:10px',text:'Shuffle the deck',onclick:function(){ FLASHCARDS = shuffle(FLASHCARDS); p.i=0; p.flipped=false; render(); }}));
  return [header('Flashcards','Tap the card to flip','practice'), w];
}

function viewFillIn(){
  var p = S.practice, f = FILL_INS[p.i];
  var w = el('div',{class:'qwrap'});
  w.appendChild(el('div',{style:'display:flex;justify-content:space-between;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px'},[
    el('span',{text:(p.i+1)+' of '+FILL_INS.length}), el('span',{text:p.right+' correct'})
  ]));
  w.appendChild(el('div',{class:'card'},[
    el('h3',{style:'font-size:18px;line-height:1.45',text:f.sentence}),
    el('p',{style:'margin:9px 0 0;font-size:13.5px;color:var(--muted)',text:'Hint: '+f.hint})
  ]));

  var input = el('input',{class:'inp',type:'text',placeholder:'Type your answer',value:p.val,
    oninput:function(e){ p.val = e.target.value; }});
  if (!p.shown) w.appendChild(input);

  if (p.shown){
    var ok = norm(p.val) === norm(f.answer);
    w.appendChild(el('div',{class:'explain '+(ok?'ok':'no')},[
      el('b',{text: ok ? '✅ Correct. ' : '❌ Answer: '}),
      document.createTextNode(ok ? 'You wrote "'+p.val+'".' : f.answer)
    ]));
    var last = p.i === FILL_INS.length - 1;
    w.appendChild(el('button',{class:'btn gold',text: last ? 'Start over' : 'Next',onclick:function(){
      if (last){ S.practice = {mode:'fillin', i:0, val:'', shown:false, right:0}; }
      else { p.i++; p.val=''; p.shown=false; }
      render();
    }}));
  } else {
    w.appendChild(el('button',{class:'btn gold',text:'Check answer',onclick:function(){
      p.shown = true;
      if (norm(p.val) === norm(f.answer)) p.right++;
      render();
    }}));
    w.appendChild(el('button',{class:'btn ghost',text:'Skip',onclick:function(){ p.shown=true; render(); }}));
  }
  return [header('Fill in the blank','Type the missing words','practice'), w];
}

function viewScenarios(){
  var p = S.practice, s = SCENARIOS[p.i];
  var w = el('div',{class:'qwrap'});
  w.appendChild(el('div',{style:'font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px',
    text:'Scenario '+(p.i+1)+' of '+SCENARIOS.length}));
  w.appendChild(el('div',{class:'card'},[
    el('h3',{text:s.title}),
    el('p',{style:'margin:8px 0 0;font-size:16px;line-height:1.6',text:s.situation}),
    el('p',{style:'margin:12px 0 0;font-weight:800',text:s.question})
  ]));
  s.options.forEach(function(opt, oi){
    var cls = 'opt';
    if (p.shown){
      if (oi === s.correct) cls += ' correct';
      else if (oi === p.picked) cls += ' wrong';
      else cls += ' dim';
    }
    w.appendChild(el('button',{class:cls,text:opt,onclick:function(){
      if (p.shown) return; p.picked = oi; p.shown = true; render();
    }}));
  });
  if (p.shown){
    w.appendChild(el('div',{class:'explain '+(p.picked===s.correct?'ok':'no'),style:'margin-top:12px'},[
      document.createTextNode(s.explain)
    ]));
    var last = p.i === SCENARIOS.length - 1;
    w.appendChild(el('button',{class:'btn gold',text: last ? 'Start over' : 'Next scenario',onclick:function(){
      if (last){ S.practice = {mode:'scenarios', i:0, shown:false, picked:null}; }
      else { p.i++; p.shown=false; p.picked=null; }
      render();
    }}));
  }
  return [header('Real scenarios','Field situations','practice'), w];
}

function viewChecklists(){
  var w = el('div',{});
  var cgrid = el('div',{class:'colgrid'});
  CHECKLISTS.forEach(function(cl, ci){
    var card = el('div',{class:'card',style:'border-color:'+cl.color});
    card.appendChild(el('h3',{style:'color:'+cl.color,text:cl.title}));
    card.appendChild(el('div',{style:'height:6px'}));
    cl.items.forEach(function(it, ii){
      var key = ci+'-'+ii, on = !!S.checks[key];
      card.appendChild(el('button',{class:'chk'+(on?' on':''),onclick:function(){
        S.checks[key] = !on; Store.set('jeps_checks', S.checks); render();
      }},[
        el('span',{class:'box',text: on ? '✓' : ''}),
        el('span',{style:'font-size:15.5px;line-height:1.45',text:it})
      ]));
    });
    cgrid.appendChild(card);
  });
  w.appendChild(cgrid);
  w.appendChild(el('div',{style:'height:14px'}));
  w.appendChild(el('button',{class:'btn ghost',text:'Clear all checkmarks',onclick:function(){
    S.checks = {}; Store.set('jeps_checks', {}); render();
  }}));
  return [header('Field checklists','Tap to check off','practice'), w];
}

function viewKeyTerms(){
  var w = el('div',{});
  var grid = el('div',{class:'colgrid'});
  var half = Math.ceil(KEY_TERMS.length/2);
  [KEY_TERMS.slice(0,half), KEY_TERMS.slice(half)].forEach(function(chunk){
    var card = el('div',{class:'card'});
    chunk.forEach(function(t){
      card.appendChild(el('div',{class:'term'},[
        el('b',{text:t.term}),
        el('p',{text:t.definition})
      ]));
    });
    grid.appendChild(card);
  });
  w.appendChild(grid);
  return [header('Glossary', KEY_TERMS.length+' terms','practice'), w];
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  var app = document.getElementById('app');
  app.innerHTML = '';
  var parts;
  switch (S.view){
    case 'module': parts = viewModule(); break;
    case 'quiz': parts = viewQuiz(); break;
    case 'result': parts = viewResult(); break;
    case 'practice': parts = viewPractice(); break;
    case 'flashcards': parts = viewFlashcards(); break;
    case 'fillin': parts = viewFillIn(); break;
    case 'scenarios': parts = viewScenarios(); break;
    case 'checklists': parts = viewChecklists(); break;
    case 'keyterms': parts = viewKeyTerms(); break;
    default: parts = viewHome();
  }
  var main = el('main',{class:'main'});
  main.appendChild(parts[1]);
  app.appendChild(parts[0]);
  app.appendChild(el('div',{class:'shell'},[ buildNav(), main ]));
}
render();
</script>
</body>
</html>
